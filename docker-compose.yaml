version: '3.8'

services:
  product-service:
    build: ./product-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  order-service:
    build: ./order-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      # Docker lets containers talk to each other using their service names!
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - ORDER_SERVICE_URL=http://order-service:8001
    depends_on:
      - product-service
      - order-service